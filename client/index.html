<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!--
      PWA 설치 정보(manifest)는 화면마다 다르다.
        · /student-kiosk ... : "PageOne 수납" (Lenovo 태블릿 학생 수납 전용,
          scope 이 /student-kiosk 로 좁혀져 있고 service worker 도 main.tsx 에서
          이 경로일 때만 등록된다)
        · 그 외 모든 경로   : "페이지원영어학원 관리" (원장 데스크톱 설치용,
          service worker 없음 — 회계 화면이 옛 캐시로 보이면 위험하므로
          관리 화면에는 일부러 캐시를 두지 않는다)
      예전에는 수납 manifest 하나만 정적으로 걸려 있어서, 원장 컴퓨터에서
      '설치'를 눌러도 자꾸 수납 앱이 설치되는 문제가 있었다. 그래서 아래
      스크립트가 현재 주소를 보고 맞는 manifest 를 골라 건다.
      (동기 스크립트라 크롬이 설치 가능 여부를 판정하기 전에 반드시 실행된다.)
    -->
    <script>
      (function () {
        var kiosk = location.pathname.indexOf("/student-kiosk") === 0;
        var link = document.createElement("link");
        link.rel = "manifest";
        link.href = kiosk ? "/student-kiosk.webmanifest" : "/app.webmanifest";
        document.head.appendChild(link);
        var theme = document.createElement("meta");
        theme.name = "theme-color";
        theme.content = kiosk ? "#0f172a" : "#F96E00";
        document.head.appendChild(theme);
        var title = document.createElement("meta");
        title.name = "apple-mobile-web-app-title";
        title.content = kiosk ? "PageOne 수납" : "페이지원 관리";
        document.head.appendChild(title);
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/pageone-icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/pageone-icon.svg" />
    <title>페이지원영어학원 관리</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
