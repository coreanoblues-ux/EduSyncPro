[build]
builder = "NIXPACKS"
# 저장소에 package-lock.json이 없으므로 npm ci는 실패한다. npm install을 쓴다.
buildCommand = "npm install && npm run build"

[deploy]
# 배포 전에 DB 구조를 schema.ts에 맞춰 자동 반영한다.
# 빌드가 끝난 뒤, 새 버전이 트래픽을 받기 전에 실행되므로 앱이 끊기는 구간이 없다.
# 실패하면 배포가 중단되고 기존 버전이 그대로 서비스되므로 안전하다.
# --force를 붙이지 않았다: 데이터가 지워지는 변경이 필요한 경우 자동 승인하지 않고 실패시키기 위함.
# npx로 drizzle-kit을 즉석 설치하면 격리된 경로에 깔려 drizzle-orm을 못 찾는다.
# 반드시 이미지에 설치된 로컬 drizzle-kit(npm run db:push)을 써야 한다.
# 1) 멱등 마이그레이션: pgEnum 값 추가는 drizzle-kit push가 (데이터 손실 우려로) 대화형 확인을
#    요구할 수 있어 배포가 멈춘다. 그런 위험 구간을 미리 처리한다.
# 2) drizzle-kit push: 나머지 컬럼 추가 등 안전한 변경을 반영한다.
# 3) level-test-records 는 push '뒤'에 둔다. 이 스크립트는 tenants/consultations/
#    students/users 를 외래키로 참조하므로, 완전히 빈 DB에서는 push가 먼저 그
#    테이블들을 만들어 줘야 한다. (push는 복합 유니크를 표현할 수 없어서
#    인덱스 생성은 이 스크립트가 따로 맡는다 — 스크립트 주석 참조)
# 4) level-test-share 는 **맨 마지막**이다. level_tests 테이블이 있어야 돌아가므로
#    3) 보다 뒤여야 한다. push 가 칼럼 자체는 먼저 만들어 둘 수 있지만, 이 기능에
#    필요한 **부분 유니크 인덱스**(share_token IS NOT NULL)는 push 가 표현하지
#    못한다. 그 인덱스가 없으면 같은 주소가 두 기록에 생길 수 있고, 학부모가
#    링크를 누를 때마다 전체 테이블을 훑는다. 그래서 이 스크립트가 따로 맡는다.
#    여러 번 돌아도 안전하다(IF NOT EXISTS) — 이미 있으면 "이미 존재" 만 찍는다.
# 5) tenant-share-phone: tenants.share_phone 한 칸.
#    ⚠️ 이 줄은 **사고를 겪고 추가됐다.** NULL 허용 칼럼이라 위 2)의 push 가
#    알아서 더해 줄 것이라 보고 전용 스크립트를 만들지 않았는데, 배포는
#    초록색으로 끝났지만 **로그인이 안 됐다.** Drizzle 은 SELECT 에 칼럼
#    이름을 하나하나 적기 때문에, 스키마에만 있고 DB 에 없는 칼럼이 하나라도
#    생기면 그 테이블을 읽는 모든 경로가 죽는다. 로그인은 비밀번호 확인 뒤
#    학원 정보를 읽으므로 거기서 멈췄다.
#    교훈: **이 저장소에서 칼럼 추가는 push 에 맡기지 않는다.** 위 1)~4)가
#    전부 전용 스크립트인 이유가 이것이고, 앞으로 칼럼을 더할 때도 같은 모양의
#    스크립트를 만들어 이 줄 뒤에 잇는다. 테스트가 이 사실을 글자로 확인한다.
preDeployCommand = "npm run db:migrate:level-test && npm run db:migrate:toss-front && npm run db:migrate:toss-kiosk && npm run db:push && npm run db:migrate:level-test-records && npm run db:migrate:level-test-share && npm run db:migrate:tenant-share-phone"
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
