<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EduSyncPro Toss Front</title>
    <!--
      결제 단말기 모드 진입점.

      화면 렌더는 sdk.template.* 이 담당한다 (Toss 심사 정책: 화면은 반드시
      Template API 로만 구성). 다만 0.2.x 에서 background:#000 만 두었다가,
      스크립트가 아예 실행되지 않았을 때 "완전한 검은 화면"이 되어 아무 진단도
      못 하는 사고가 났다.

      그래서 안내 문구를 HTML 에 정적으로 심어 둔다. 이 문구가 그대로 남아
      있다면 "번들 스크립트가 로드조차 되지 않았다"는 뜻이고, 문구가 바뀌었다면
      플러그인 코드는 최소한 실행됐다는 뜻이다. 현장에서 이 구분이 결정적이다.

      ── 0.3.26: 이 노드가 유일한 안전망이 됐다 ──
        0.3.25 까지는 screen.ts 가 자체 DOM 화면(#edusync-front-root)을 별도로
        만들었는데, 그것이 "화면을 직접 구성하는 수준" 으로 검수에서 반려됐다.
        이제 플러그인 코드는 DOM 을 일절 만들지 않는다. 표준 화면을 못 띄웠을
        때는 아래 #boot 노드의 글자(textContent)만 바꿔서 보여 주고, 표준
        화면이 그려지면 hidden 으로 숨긴다 (지우지 않는다 — 재사용해야 한다).
    -->
    <!--
      ⚠️ Toss SDK CDN 스크립트는 여기(head)에 없다. body 끝, #app 아래로 내렸다.
         이유는 그 자리의 주석에 적어 두었다. 여기로 다시 올리면 React #299 가
         돌아온다.
    -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0f172a;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #boot .brand {
        font-size: 15px;
        letter-spacing: 2px;
        color: #64748b;
        font-weight: 700;
      }
      #boot .title {
        font-size: 30px;
        font-weight: 800;
        color: #f97316;
      }
      #boot .sub {
        font-size: 16px;
        color: #94a3b8;
        max-width: 560px;
        line-height: 1.5;
      }
      /*
        진단 로그 (표준 화면 실패 시에만 JS 가 hidden 을 푼다).
        단말기에는 개발자도구가 없으므로, 표준 화면이 안 그려지는 상황에서는
        이 몇 줄이 원장이 원인을 읽을 유일한 수단이다.
      */
      #boot .diag {
        margin: 14px 0 0;
        font-size: 11px;
        line-height: 1.6;
        color: #64748b;
        max-width: 88vw;
        max-height: 26vh;
        overflow: hidden;
        white-space: pre-wrap;
        word-break: break-all;
        text-align: left;
      }
      /*
        ⚠️ hidden 속성이 실제로 통하게 하는 가드.
        #boot 은 display:flex 라서, CSS 의 display 지정이 UA 의 [hidden] 규칙을
        이겨 버린다 — hidden 을 줘도 화면에 그대로 남는다는 뜻이다. 이 한 줄이
        없으면 플러그인이 hideStaticNotice() 를 불러도 표준 화면 위에 이 안내가
        계속 덮여 있게 된다 (0.3.26 에서 hidden 토글 방식으로 바꾸며 확인).
      */
      #boot[hidden],
      #boot .diag[hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <!--
      Toss Template API 가 마운트할 컨테이너.

      ⚠️ id 는 반드시 "app" 이다. "root" 가 아니다. (0.3.25 에서 고친 실제 사고)
        0.3.24 까지 여기 id="root" 라고 적혀 있었다. 그런데 CDN SDK 번들을 직접
        내려받아 확인한 결과 렌더 코드는 정확히 이렇다:
            root = createRoot(document.getElementById("app"))
        공식 템플릿(toss-front-plugin-template → front-plugin-js/index.html)도
        <div id="app"></div> 를 둔다. 이름이 달라서 SDK 가 null 을 쥐었고,
        단말기에서 renderIdlePage / renderResultPage 가 전부 React #299 로 죽어
        표준 화면 대신 텍스트 폴백만 나왔다 (2026-09-10 원장 로그 캡처로 확인).

      ── 0.3.5 에서 이 노드를 추가한 이유 (그때의 사고) ──
        sdk.template.* 는 React 로 구현되어 있고, 호출되면 createRoot(container) 를
        한다. 이 div 가 없으면 container 가 null 이 되어 단말기에 이런 화면이 뜬다:
            "Minified React error #299" (= Target container is not a DOM element)
        0.3.4 까지 이 노드가 없었다. 그래서 등록 화면이 아예 그려지지 않고 곧바로
        "단말기 등록 실패" 로 떨어졌다 — 코드를 입력할 기회조차 없었다.
        이 div 는 비어 있어야 한다. 우리 코드가 절대 건드리지 않는다 (screen.ts 는
        자기 전용 노드 #edusync-front-root 만 만들고 지운다).
      스크립트보다 위에 둔다. 아래에 두면 스크립트가 먼저 돌아 같은 오류가 난다.
    -->
    <div id="app"></div>
    <!--
      정적 안내 노드 (플러그인의 유일한 텍스트 안전망).

      · 자식들의 id 는 screen.ts 가 textContent 를 갱신할 때 쓴다. 플러그인은
        여기서 어떤 노드도 만들거나 지우지 않는다 — 글자와 hidden 속성만 바꾼다.
      · 버전을 화면에 박아 두는 이유 (2026-08-29): 원장이 보낸 단말기 사진에는
        아무 문구도 없었다. 그래서 어느 번들이 올라가 있는지조차 확인할 수 없었고,
        며칠 동안 화면을 못 보는 상태로 버전만 올렸다. 앞으로는 사진 한 장이면
        어느 번들인지 판별된다. 이 하드코딩 문구가 그대로면 "스크립트 로드 실패",
        setScreenVersion 이 덮어쓴 값이 보이면 "플러그인 코드 실행됨" 이다.
        (Toss 는 테스트 단말기로 등록된 프론트에 '개발 배포' 트랙 코드를 내려보낸다.
         라이브 트랙에 올린 zip 은 그 단말기에 반영되지 않는다.)
    -->
    <div id="boot">
      <div class="brand" id="boot-brand">PAGE ONE · EDUSYNCPRO · v0.3.29</div>
      <div class="title" id="boot-title">플러그인을 시작하는 중</div>
      <div class="sub" id="boot-detail">이 화면이 계속 보이면 플러그인 스크립트가 로드되지 않은 것입니다.</div>
      <pre class="diag" id="boot-diag" hidden></pre>
    </div>

    <!--
      Toss Front 2 공식 SDK 로더.

      ── 왜 head 가 아니라 여기인가 (2026-08-29 에 내렸고, 그대로 둔다) ──
        당시 진단은 "CDN 스크립트가 head 에 있어서 컨테이너보다 먼저 실행되는 것이
        #299 의 원인" 이었다. 0.3.25 에서 SDK 번들을 직접 읽어 보니 그 진단은
        불완전했다 — SDK 는 렌더 함수를 부르는 순간에 컨테이너를 찾는 lazy 방식이라
        스크립트 위치는 사실 무관했고, 진짜 원인은 컨테이너 id 가 "root" 로 잘못
        되어 있던 것이었다 (SDK 는 "app" 만 찾는다. 위 div 주석 참조).

        그래도 이 위치를 유지한다: 컨테이너 아래에 두면 "스크립트 실행 시점에
        컨테이너가 이미 DOM 에 있다" 가 구조적으로 보장되어, 혹시 미래 SDK 버전이
        로드 시점에 컨테이너를 잡는 방식으로 바뀌어도 안전하다. head 로 되돌려서
        얻는 이점은 없다.

      ── 순서가 깨지지 않는 이유 ──
        진입 스크립트는 type="module" 이라 항상 defer 다 (문서 파싱이 끝난 뒤 실행).
        반면 이 CDN 스크립트는 defer 없는 고전 스크립트라 파서가 여기 닿는 즉시
        실행된다. 그러므로 body 끝에 두어도 여전히 진입 코드보다 먼저 돌고,
        window.TossFrontSDK 는 준비된 상태다.

        ⚠️ 빌드 결과(dist/index.html)를 직접 확인한 사실:
           vite 는 맨 아래 module 진입 스크립트를 그 자리에 두지 않고 <head> 로
           끌어올린다 (./assets/index-*.js 로 바꿔서). 그래도 module 이라 defer
           이므로 이 CDN 스크립트보다 늦게 돈다 — 순서는 그대로다.
           즉 우리가 지켜야 할 조건은 "이 CDN 스크립트가 #app 아래에 있을 것"
           하나뿐이고, 진입 스크립트의 위치는 vite 가 정한다. 새 번들을 올릴 때는
           dist/index.html 에서 이 순서(#app → CDN 스크립트)를 눈으로 확인할 것.

           (여기에 진입 스크립트의 경로를 그대로 적지 말 것. pack 스크립트가
            dist/index.html 전체에서 .ts 참조를 찾아 빌드 실패로 처리하는데,
            주석 안의 글자도 똑같이 걸린다. 실제로 한 번 걸렸다.)
    -->
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script type="module" src="./src/index.ts"></script>
  </body>
</html>
