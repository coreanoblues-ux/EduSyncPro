<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EduSyncPro Toss Front</title>
    <!--
      결제 단말기 모드 진입점.

      화면 렌더는 원칙적으로 sdk.template.* 이 담당한다. 다만 0.2.x 에서
      background:#000 만 두었다가, 스크립트가 아예 실행되지 않았을 때
      "완전한 검은 화면"이 되어 아무 진단도 못 하는 사고가 났다.

      그래서 부팅 문구를 HTML 에 직접 심어 둔다. 이 문구가 그대로 남아 있다면
      "번들 스크립트가 로드조차 되지 않았다"는 뜻이고, 문구가 바뀌었다면
      플러그인 코드는 최소한 실행됐다는 뜻이다. 현장에서 이 구분이 결정적이다.
      플러그인이 부팅되면 screen.ts 가 이 노드를 덮어쓴다.
    -->
    <!--
      Toss Front 2 공식 SDK 로더 — head 안에 두는 이유:
        vite 는 type="module" 진입 스크립트를 head 로 hoist 한다. 이 CDN 스크립트가
        그보다 뒤에 놓이면 브라우저가 defer 순서를 잘못 잡을 여지가 있다.
        head 의 이 위치에 두면 vite 가 뒤에 삽입할 module 스크립트보다 먼저 실행되어
        window.TossFrontSDK 가 확실히 준비된 상태에서 진입 코드가 돈다.
        (공식 template github.com/tossplace/toss-front-plugin-template 도 head 에 둔다.)
    -->
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0f172a;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #boot .brand {
        font-size: 15px;
        letter-spacing: 2px;
        color: #64748b;
        font-weight: 700;
      }
      #boot .title {
        font-size: 30px;
        font-weight: 800;
        color: #f97316;
      }
      #boot .sub {
        font-size: 16px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <!--
      Toss Template API 가 마운트할 컨테이너.

      ── 0.3.5 에서 추가한 이유 (실제 사고) ──
        sdk.template.* 는 React 로 구현되어 있고, 호출되면 createRoot(container) 를
        한다. 이 div 가 없으면 container 가 null 이 되어 단말기에 이런 화면이 뜬다:
            "Minified React error #299" (= Target container is not a DOM element)
        0.3.4 까지 이 노드가 없었다. 그래서 등록 화면이 아예 그려지지 않고 곧바로
        "단말기 등록 실패" 로 떨어졌다 — 코드를 입력할 기회조차 없었다.
        이 div 는 비어 있어야 한다. 우리 코드가 절대 건드리지 않는다 (screen.ts 는
        자기 전용 노드 #edusync-front-root 만 만들고 지운다).
      스크립트보다 위에 둔다. 아래에 두면 스크립트가 먼저 돌아 같은 오류가 난다.
    -->
    <div id="root"></div>
    <!--
      버전을 화면에 박아 둔다.

      ── 왜 (2026-08-29) ──
        원장이 보낸 단말기 사진에는 아무 문구도 없었다. 그래서 "0.3.5~0.3.8 중
        어느 번들이 올라가 있는지"조차 확인할 수 없었고, 며칠 동안 화면을 못 보는
        상태로 버전만 올렸다. 앞으로는 사진 한 장이면 어느 번들인지 판별된다.
        (Toss 는 테스트 단말기로 등록된 프론트에 '개발 배포' 트랙 코드를 내려보낸다.
         라이브 트랙에 올린 zip 은 그 단말기에 반영되지 않는다.)
    -->
    <div id="boot">
      <div class="brand">PAGE ONE · EDUSYNCPRO · v0.3.9</div>
      <div class="title">플러그인을 시작하는 중</div>
      <div class="sub">이 화면이 계속 보이면 플러그인 스크립트가 로드되지 않은 것입니다.</div>
    </div>
    <script type="module" src="./src/index.ts"></script>
  </body>
</html>
