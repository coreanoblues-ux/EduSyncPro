<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EduSyncPro Toss Front</title>
    <!--
      결제 단말기 모드 진입점.

      화면 렌더는 원칙적으로 sdk.template.* 이 담당한다. 다만 0.2.x 에서
      background:#000 만 두었다가, 스크립트가 아예 실행되지 않았을 때
      "완전한 검은 화면"이 되어 아무 진단도 못 하는 사고가 났다.

      그래서 부팅 문구를 HTML 에 직접 심어 둔다. 이 문구가 그대로 남아 있다면
      "번들 스크립트가 로드조차 되지 않았다"는 뜻이고, 문구가 바뀌었다면
      플러그인 코드는 최소한 실행됐다는 뜻이다. 현장에서 이 구분이 결정적이다.
      플러그인이 부팅되면 screen.ts 가 이 노드를 덮어쓴다.
    -->
    <!--
      ⚠️ Toss SDK CDN 스크립트는 여기(head)에 없다. body 끝, #root 아래로 내렸다.
         이유는 그 자리의 주석에 적어 두었다. 여기로 다시 올리면 React #299 가
         돌아온다.
    -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0f172a;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #boot .brand {
        font-size: 15px;
        letter-spacing: 2px;
        color: #64748b;
        font-weight: 700;
      }
      #boot .title {
        font-size: 30px;
        font-weight: 800;
        color: #f97316;
      }
      #boot .sub {
        font-size: 16px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <!--
      Toss Template API 가 마운트할 컨테이너.

      ── 0.3.5 에서 추가한 이유 (실제 사고) ──
        sdk.template.* 는 React 로 구현되어 있고, 호출되면 createRoot(container) 를
        한다. 이 div 가 없으면 container 가 null 이 되어 단말기에 이런 화면이 뜬다:
            "Minified React error #299" (= Target container is not a DOM element)
        0.3.4 까지 이 노드가 없었다. 그래서 등록 화면이 아예 그려지지 않고 곧바로
        "단말기 등록 실패" 로 떨어졌다 — 코드를 입력할 기회조차 없었다.
        이 div 는 비어 있어야 한다. 우리 코드가 절대 건드리지 않는다 (screen.ts 는
        자기 전용 노드 #edusync-front-root 만 만들고 지운다).
      스크립트보다 위에 둔다. 아래에 두면 스크립트가 먼저 돌아 같은 오류가 난다.
    -->
    <div id="root"></div>
    <!--
      버전을 화면에 박아 둔다.

      ── 왜 (2026-08-29) ──
        원장이 보낸 단말기 사진에는 아무 문구도 없었다. 그래서 "0.3.5~0.3.8 중
        어느 번들이 올라가 있는지"조차 확인할 수 없었고, 며칠 동안 화면을 못 보는
        상태로 버전만 올렸다. 앞으로는 사진 한 장이면 어느 번들인지 판별된다.
        (Toss 는 테스트 단말기로 등록된 프론트에 '개발 배포' 트랙 코드를 내려보낸다.
         라이브 트랙에 올린 zip 은 그 단말기에 반영되지 않는다.)
    -->
    <div id="boot">
      <div class="brand">PAGE ONE · EDUSYNCPRO · v0.3.18</div>
      <div class="title">플러그인을 시작하는 중</div>
      <div class="sub">이 화면이 계속 보이면 플러그인 스크립트가 로드되지 않은 것입니다.</div>
    </div>

    <!--
      Toss Front 2 공식 SDK 로더.

      ── 왜 head 가 아니라 여기인가 (2026-08-29, 드디어 원인을 잡았다) ──
        단말기 화면에 이 오류가 찍혀 있었다:
          renderIdlePage 실패 — Error: Minified React error #299
        #299 의 원문은 정확히 이것이다:
          "createRoot(...): Target container is not a DOM element."
        그리고 React 문서가 드는 대표 원인이 우리 상황 그대로다:
          "The script loads before the DOM element is rendered."

        0.3.4 까지는 #root 노드 자체가 없었다. 0.3.5 에서 그걸 추가했는데도 #299 가
        그대로였다. 노드를 "만들긴 했지만 너무 늦게" 만들었기 때문이다 — 이 CDN
        스크립트가 head 에 있었으므로, 스크립트가 실행되는 시점에 body 는 아직
        파싱되지도 않았고 #root 는 존재하지 않았다. SDK 가 그 순간 컨테이너를
        잡아 두면 null 을 쥐게 되고, 나중에 renderIdlePage 를 부르는 순간
        createRoot(null) 로 터진다. 0.3.5~0.3.11 동안 대기화면이 한 번도 안 그려진
        이유가 이것이다.

        그래서 #root 아래로 내렸다. 이제 이 스크립트가 실행될 때 #root 는 이미
        DOM 에 있다.

      ── 순서가 깨지지 않는 이유 ──
        진입 스크립트는 type="module" 이라 항상 defer 다 (문서 파싱이 끝난 뒤 실행).
        반면 이 CDN 스크립트는 defer 없는 고전 스크립트라 파서가 여기 닿는 즉시
        실행된다. 그러므로 body 끝에 두어도 여전히 진입 코드보다 먼저 돌고,
        window.TossFrontSDK 는 준비된 상태다. head 에 둘 때 얻는 이점은 없고
        #root 를 못 보는 손해만 있었다.

        ⚠️ 빌드 결과(dist/index.html)를 직접 확인한 사실:
           vite 는 맨 아래 module 진입 스크립트를 그 자리에 두지 않고 <head> 로
           끌어올린다 (./assets/index-*.js 로 바꿔서). 그래도 module 이라 defer
           이므로 이 CDN 스크립트보다 늦게 돈다 — 순서는 그대로다.
           즉 우리가 지켜야 할 조건은 "이 CDN 스크립트가 #root 아래에 있을 것"
           하나뿐이고, 진입 스크립트의 위치는 vite 가 정한다. 새 번들을 올릴 때는
           dist/index.html 에서 이 순서(#root → CDN 스크립트)를 눈으로 확인할 것.

           (여기에 진입 스크립트의 경로를 그대로 적지 말 것. pack 스크립트가
            dist/index.html 전체에서 .ts 참조를 찾아 빌드 실패로 처리하는데,
            주석 안의 글자도 똑같이 걸린다. 실제로 한 번 걸렸다.)
    -->
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script type="module" src="./src/index.ts"></script>
  </body>
</html>
